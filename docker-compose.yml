# ============================================================
#  GIS 开发环境 — PostGIS + pgAdmin 容器编排
#  一键启动: docker compose up -d
# ============================================================

services:

  # -------- PostGIS 空间数据库 --------
  postgis:
    image: postgis/postgis:16-3.4
    container_name: gis-postgis
    environment:
      POSTGRES_USER: gisuser
      POSTGRES_PASSWORD: gispass123
      POSTGRES_DB: gisdb
    ports:
      - "5432:5432"                               # 宿主机:容器
    volumes:
      - postgis-data:/var/lib/postgresql/data     # 数据持久化
      - ./python-data/data:/data                  # 挂载项目数据目录
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gisuser -d gisdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------- pgAdmin 数据库管理界面 --------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gis-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gis.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"                                 # 浏览器访问 localhost:8080
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy                # 等待 PostGIS 就绪

# -------- 命名卷（数据持久化） --------
volumes:
  postgis-data:
  pgadmin-data:
